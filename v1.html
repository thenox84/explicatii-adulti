/* ------------ editor de cod ------------ */
function codeBlock(p,x,y,lines,o={}){
  const g=N(p,x,y);const lh=o.lh||30,size=o.size||20;
  const nodes=lines.map((l,i)=>TX(g,0,i*lh,'',size,colorFor(l),{mono:true}));
  const total=lines.reduce((a,s)=>a+s.length,0);
  return {g,total,set(n,cur){typeLines(nodes,lines,n,cur);}};
}
function colorFor(l){const s=l.trim();
  if(s.startsWith('struct'))return '#F6AD55';if(s.startsWith('@')||s.startsWith('.'))return '#B794F4';
  if(s.startsWith('var')||s.startsWith('let'))return '#8EC5FF';if(s==='}'||s==='')return '#9AA6C2';return '#D7DEEC';}

    const q='sar'.slice(0,Math.floor(clamp((lt-9.6)/1.8)*3));
    const qOn=lt>9.4&&lt<15.4;
    const fp=prog(lt,11.6,.8)*(1-prog(lt,15.2,.8));
    const fav=lt<18.6?0:prog(lt,18.6,.7);
    const tapO=clamp(1-Math.abs(lt-18.5)/.45);
    const shop=prog(lt,24.6,.8);
    const checked=Math.floor(clamp((lt-26)/1.1,0,5));
    app.set({q:qOn?q:'',qc:qOn&&lt<12,fp,fav,shop,checked,tab:0,tap:tapO>0?{x:258,y:156+35,o:tapO}:null});
    vis(card,lt,33.2,1e9,{dx:40,dy:0});secs.forEach(s=>vis(s.n,lt,s.t,1e9,{dx:16,dy:0}));
  };
}});

/* ---------- 11. Recapitulare ---------- */
scene({title:'Recapitulare',dur:44,subs:[
  [.6,8,'Pe scurt, tot drumul: de la mesajul lui Tudor…'],
  [8.5,16.5,'…la înțelegere, plan, subagenți și unelte…'],
  [17,25,'…prin erori și reparații, până la verificare și produsul finit.'],
  [25.5,33,'La punctele importante, omul aprobă și decide.'],
  [33.5,43.8,'Agentul nu e magie: e un model care gândește în bucle, folosește unelte și își verifică munca.']],
build(g){
  const ND=[['Mesaj','chat',.6],['Înțelegere','lupa',3.2],['Plan','list',5.8],['Subagenți','team',8.6],['Unelte','hammer',11.2],['Erori și reparații','term',17.2],['Verificare','check',20],['Produs finit','phone',22.8]];
  const P=[[230,320],[600,320],[970,320],[1340,320],[1340,540],[970,540],[600,540],[230,540]];
  const lines=N(g,0,0);
  const conns=[];for(let i=0;i<7;i++){const [x1,y1]=P[i],[x2,y2]=P[i+1];let c;
    if(i===3)c=arrow(lines,1340,368,1340,492,C.dim,3);
    else if(i<3)c=arrow(lines,x1+138,y1,x2-138,y2,C.dim,3);else c=arrow(lines,x1-138,y1,x2+138,y2,C.dim,3);conns.push(c);}
  const lpA=N(g,0,0);
  E('path',{d:'M600,588 C600,690 1340,690 1340,588',fill:'none',stroke:C.teal,'stroke-width':3,'stroke-dasharray':'8 9'},lpA);
  arrow(lpA,1338,600,1340,590,C.teal,3);
  TX(lpA,970,690,'bucla: gândește → acționează → privește rezultatul',20,C.teal,{a:'middle',it:true});
  const nodes=ND.map((d,i)=>{const n=N(g,P[i][0],P[i][1]);
    E('rect',{x:-130,y:-46,width:260,height:92,rx:22,fill:C.panel2,stroke:i===7?C.warm:C.line,'stroke-width':i===7?3:2},n);
    const ic=E('g',{transform:'translate(-90,0)'},n);icon(ic,d[1],32,i===7?C.warm:C.text,3);
    const long=d[0].length>12;TX(n,-56,long?-4:8,long?'Erori și':d[0],22,C.text,{w:600});if(long)TX(n,-56,22,'reparații',22,C.text,{w:600});
    return {n,t:d[2]};});
  const appr=[1,4,7].map(i=>{const n=N(g,P[i][0]+106,P[i][1]-46);E('circle',{r:22,fill:C.warm},n);icon(n,'person',24,'#2A1B05',3.5);return n;});
  const apL=N(g,1270,214);TX(apL,0,0,'= omul aprobă',20,C.warm,{w:600});const apI=N(g,1236,207);E('circle',{r:14,fill:C.warm},apI);icon(apI,'person',16,'#2A1B05',3.5);
  const fin=N(g,800,170);
  TX(fin,0,0,'Agentul nu e magie: e un model care gândește în bucle,',30,C.text,{a:'middle',w:600});
  TX(fin,0,44,'folosește unelte și își verifică munca.',30,C.warm,{a:'middle',w:700});
  return lt=>{
    nodes.forEach((n,i)=>vis(n.n,lt,n.t,1e9,{s:.8,dy:0}));
    conns.forEach((c,i)=>setO(c,prog(lt,nodes[i+1].t-.4,.6)));
    vis(lpA,lt,24,1e9,{dy:0});
    appr.forEach((n,i)=>vis(n,lt,25.8+i*.8,1e9,{s:.3,dy:0}));vis(apL,lt,27.8,1e9,{dy:0});vis(apI,lt,27.8,1e9,{dy:0});
    vis(fin,lt,34,1e9,{dy:10,d:1.2});
    apL.style.display=lt>33.5?'none':apL.style.display;apI.style.display=lt>33.5?'none':apI.style.display;
  };
}});

/* ============================================================
   Cronologia
   ============================================================ */
const HOLD=15;let acc=0;
const root=E('g',null,svg);
const bgDeco=E('g',{opacity:.5},root);
SCENES.forEach((s,i)=>{s.start=acc;acc+=s.dur;s.g=E('g',null,root);s.update=s.build(s.g);s.g.style.display='none';s.i=i;});
const TOTAL=acc;
// titlul capitolului
const chap=N(svg,70,58);
const chapN=TX(chap,0,0,'',15,C.muted,{ls:4,w:600});
const chapT=TX(chap,0,34,'',27,C.text,{w:600});
const chapLine=E('rect',{x:0,y:48,width:40,height:3,rx:1.5,fill:C.warm},chap);

const subEl=document.getElementById('subtext'),subBox=document.getElementById('sub');
let lastSub=null,active=null;
function render(T){
  GT=T;
  const tt=Math.min(T,TOTAL-.001);
  let s=SCENES[SCENES.length-1];for(const sc of SCENES){if(tt>=sc.start&&tt<sc.start+sc.dur){s=sc;break;}}
  if(active!==s){if(active)active.g.style.display='none';s.g.style.display='';active=s;}
  const lt=Math.min(T-s.start,s.dur);
  const last=s.i===SCENES.length-1;
  const op=clamp(lt/.7)*(last?1:clamp((s.dur-lt)/.7));
  s.g.setAttribute('opacity',op.toFixed(3));
  s.update(lt);
  BOB.forEach(b=>b.n.setAttribute('transform','translate(0,'+(Math.sin(T*1.6+b.ph)*b.amp).toFixed(2)+')'));
  // capitol
  if(s.title){chapN.textContent='CAPITOLUL '+s.i;chapT.textContent=s.title;
    const co=prog(lt,.2,.8)*(last?1:1-prog(lt,s.dur-.7,.6));setO(chap,co*(lt<5?1:lerp(1,.6,prog(lt,5,1.5))));
    chapLine.setAttribute('width',(40*prog(lt,.4,1)).toFixed(1));}
  else setO(chap,0);
  // subtitrare
  let txt='',so=0;
  for(const [a,b,t] of s.subs){if(lt>=a&&lt<b){txt=t;so=Math.min(1,(lt-a)/.35,(b-lt)/.35);break;}}
  if(txt!==lastSub){subEl.textContent=txt;lastSub=txt;}
  subEl.style.opacity=so.toFixed(3);
  // bara de progres
  fillEl.style.width=(100*Math.min(T,TOTAL)/TOTAL).toFixed(3)+'%';
}

/* ============================================================
   Redare, scalare, control
   ============================================================ */
const hintEl=document.getElementById('hint'),stage=document.getElementById('stage'),bar=document.getElementById('bar'),track=document.getElementById('track'),fillEl=document.getElementById('fill'),tip=document.getElementById('tip'),pausedEl=document.getElementById('paused');
SCENES.forEach(s=>{if(s.i===0)return;const m=document.createElement('div');m.className='mk';m.style.left=(100*s.start/TOTAL)+'%';track.appendChild(m);});
function layout(){
  const W=window.innerWidth,H=window.innerHeight;
  let s=Math.min(W/1600,H/900);
  const band=H-900*s; // spațiu liber vertical
  const portrait=band>150&&W<H;
  let top=(H-900*s)/2;
  if(portrait){const fs=Math.max(15,Math.min(20,W/22));const need=fs*1.32*4+40;top=Math.max(8,(H-900*s-need)/2);
    hintEl.style.display='block';
    subBox.style.left='16px';subBox.style.width=(W-32)+'px';subBox.style.top=(top+900*s+14)+'px';subBox.style.height='auto';subBox.style.alignItems='flex-start';subBox.style.fontSize=fs+'px';}
  const left=(W-1600*s)/2;
  stage.style.transform=`translate(${left}px,${top}px) scale(${s})`;
  if(!portrait){hintEl.style.display='none';const fs=36*s;subBox.style.fontSize=fs+'px';subBox.style.left=(left+110*s)+'px';subBox.style.width=(1380*s)+'px';
    subBox.style.top=(top+740*s)+'px';subBox.style.height=(140*s)+'px';subBox.style.alignItems='center';}
}
window.addEventListener('resize',layout);layout();

let T=0,playing=true,prev=null;
const qs=new URLSearchParams(location.search);
if(qs.has('t'))T=Math.max(0,parseFloat(qs.get('t'))||0);
if(qs.get('pause')==='1')playing=false;
function frame(ts){
  if(prev==null)prev=ts;const dt=Math.min(.1,(ts-prev)/1000);prev=ts;
  if(playing){T+=dt;if(T>TOTAL+HOLD)T=0;}
  render(T);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);render(T);
function setPlaying(p){playing=p;pausedEl.classList.toggle('on',!p);}
function toggle(){setPlaying(!playing);}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){e.preventDefault();toggle();}
  else if(e.key==='ArrowRight'){T=Math.min(TOTAL,T+5);}
  else if(e.key==='ArrowLeft'){T=Math.max(0,T-5);}
  poke();});
function seekFromEvent(x){const r=track.getBoundingClientRect();const f=clamp((x-r.left)/r.width);
  // „lipire” de semnul de capitol cel mai apropiat (dacă e la mai puțin de 1% din lățime)
  let t=f*TOTAL;for(const s of SCENES){if(Math.abs(s.start/TOTAL-f)<.012){t=s.start;break;}}T=t;render(T);}
bar.addEventListener('click',e=>{e.stopPropagation();seekFromEvent(e.clientX);});
bar.addEventListener('mousemove',e=>{const r=track.getBoundingClientRect();const f=clamp((e.clientX-r.left)/r.width);const t=f*TOTAL;
  let s=SCENES[0];for(const sc of SCENES)if(t>=sc.start)s=sc;tip.textContent=(s.title?('Capitolul '+s.i+' · '+s.title):'Deschidere')+' — '+fmt(t);tip.style.left=clamp(e.clientX,90,window.innerWidth-90)+'px';tip.style.opacity=1;});
bar.addEventListener('mouseleave',()=>tip.style.opacity=0);
function fmt(t){t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
document.addEventListener('click',()=>{toggle();poke();});
let pokeT=null;function poke(){bar.classList.add('on');clearTimeout(pokeT);pokeT=setTimeout(()=>bar.classList.remove('on'),2500);}
document.addEventListener('mousemove',poke);document.addEventListener('touchstart',poke,{passive:true});
// pentru teste automate
window.__film={seek(t){T=t;render(T);},pause(){setPlaying(false);},play(){setPlaying(true);},total:TOTAL,scenes:SCENES.map(s=>({t:s.title,start:s.start,dur:s.dur,subs:s.subs}))};
</script>
