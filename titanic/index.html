<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Titanic: A Comedy of Errors</title>
<meta name="description" content="An animated, narrated cartoon: the sinking of the Titanic, told as a comedy of hubris, bureaucracy and one very smug iceberg.">
<link rel="preload" href="audio/narration.mp3" as="audio">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07080F;overflow:hidden;color:#F4F1EA;
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#141726}
  #stage svg{position:absolute;inset:0;width:1600px;height:900px;display:block}
  #stage text{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #stage text.mono{white-space:pre;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}
  #stage text.hand{font-family:"Comic Sans MS","Chalkboard SE","Bradley Hand","Segoe Print",system-ui,sans-serif}
  #sub{position:absolute;left:0;top:0;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:3}
  #sub span{display:inline-block;background:rgba(10,10,20,.74);color:#FFFDF7;border-radius:.5em;padding:.3em .8em .36em;
    line-height:1.3;text-align:center;font-weight:600;box-shadow:0 .2em 1.2em rgba(0,0,0,.35)}
  #sub span:empty{display:none}
  #bar{position:fixed;left:0;right:0;bottom:0;height:28px;padding:0 14px 10px;display:flex;align-items:flex-end;opacity:.25;transition:opacity .5s;z-index:5;cursor:pointer}
  body.ui #bar{opacity:1}
  #track{position:relative;width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.18);transition:height .2s}
  body.ui #track{height:6px}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:#F7C948}
  .mk{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.6);border-radius:1px}
  #tip{position:fixed;bottom:38px;transform:translateX(-50%);background:rgba(10,10,20,.9);font-size:13px;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;z-index:6}
  #snd{position:fixed;right:14px;bottom:38px;z-index:6;background:rgba(10,10,20,.7);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;
    padding:6px 13px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;opacity:.45;transition:opacity .4s}
  body.ui #snd,#snd.off{opacity:1}
  @media (max-width:900px),(max-height:500px){#snd{bottom:34px;right:8px;padding:5px 8px;font-size:12px}#snd .lbl{display:none}}
  #paused{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,10,20,.75);padding:12px 22px;border-radius:30px;font-size:17px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
  #paused.on{opacity:1}
  #hint{position:fixed;left:16px;right:16px;bottom:44px;text-align:center;color:#A9B1C7;font-size:14px;display:none;pointer-events:none}
  #start{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at center,rgba(10,10,20,.35),rgba(10,10,20,.75));transition:opacity .6s}
  #start.gone{opacity:0;pointer-events:none}
  #play{width:130px;height:130px;border-radius:50%;border:0;background:#F7C948;color:#2A1B05;font-size:54px;cursor:pointer;
    box-shadow:0 0 0 12px rgba(247,201,72,.25),0 10px 40px rgba(0,0,0,.5);animation:pulse 2s ease-in-out infinite;padding-left:12px}
  @keyframes pulse{50%{box-shadow:0 0 0 22px rgba(247,201,72,.12),0 10px 40px rgba(0,0,0,.5)}}
  #start .t1{font-size:22px;font-weight:700;text-shadow:0 2px 8px #000}
  #mute{background:none;border:0;color:#C9CFDE;text-decoration:underline;font:15px inherit;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><svg id="svg" viewBox="0 0 1600 900" aria-label="Animated film"></svg></div>
<div id="sub"><span id="subtext"></span></div>
<div id="bar"><div id="track"><div id="fill"></div></div></div>
<div id="tip"></div>
<button id="snd" class="off">🔇<span class="lbl"> Sound off</span></button>
<div id="hint">Tip: turn your phone sideways for a bigger picture.</div>
<div id="paused">⏸ Paused — tap or press Space to continue</div>
<div id="start"><button id="play" aria-label="Play with sound">▶</button><div class="t1">Play with sound</div><button id="mute">or watch without sound</button></div>
<noscript><p style="padding:20px">This film needs JavaScript.</p></noscript>
<script src="js/core.js"></script>
<script src="js/rigs.js"></script>
<script src="js/props.js"></script>
<script src="js/cast.js"></script>
<script src="js/world.js"></script>
<script src="js/interiors.js"></script>
<script src="js/script.js"></script>
<script src="js/timing.js"></script>
<script src="js/scenes/s00.js"></script>
<script src="js/scenes/s01.js"></script>
<script src="js/scenes/s02.js"></script>
<script src="js/scenes/s03.js"></script>
<script src="js/scenes/s04.js"></script>
<script src="js/scenes/s05.js"></script>
<script src="js/scenes/s06.js"></script>
<script src="js/scenes/s07.js"></script>
<script src="js/player.js"></script>
</body>
</html>
